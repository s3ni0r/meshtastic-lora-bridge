name: MeshTracker
options:
  bundleIdPrefix: com.s3ni0r
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "6ZU8CNPDC4"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MeshTracker:
    type: application
    platform: iOS
    sources:
      - path: MeshTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.s3ni0r.meshtracker"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connects to the Meshtastic tracker over Bluetooth to display its live GPS position."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Uses your location to show how far away the tracked Dronetag is."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
