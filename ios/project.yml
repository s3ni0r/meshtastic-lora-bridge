name: MeshTracker
options:
  bundleIdPrefix: com.s3ni0r
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "H6956Z7A2F"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MeshTracker:
    type: application
    platform: iOS
    sources:
      - path: MeshTracker
    # Explicit Info.plist (generated by xcodegen; gitignored) — needed for keys that the
    # INFOPLIST_KEY_* build settings can't express (UIBackgroundModes, file sharing).
    info:
      path: MeshTracker/Info.plist
      properties:
        # Version keys MUST reference the build settings — release.sh injects the train's
        # numbers at archive time via MARKETING_VERSION/CURRENT_PROJECT_VERSION overrides.
        # (xcodegen otherwise hardcodes 1.0/1 here, which shipped a mislabeled first build.)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: "Connects to the Meshtastic tracker over Bluetooth to display its live GPS position."
        NSLocationWhenInUseUsageDescription: "Uses your location to show how far away the tracked tag is."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Keep receiving BLE (stream + session recording) while backgrounded/pocketed.
        UIBackgroundModes: [bluetooth-central]
        # Expose Documents/ (sessions, CSV logs) in the Files app / Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # TestFlight (docs/testflight-release.md): no proprietary encryption —
        # internal builds skip the per-build compliance question entirely.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.s3ni0r.meshtracker"
        TARGETED_DEVICE_FAMILY: "1"
